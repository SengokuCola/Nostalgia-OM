# Fork changes by SengokuCola. Publishes firmware patch kits and attaches LookLab.
name: Nostalgia Release

on:
  push:
    tags: ['fork-v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION_OR_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release inputs
        run: |
          VERSION="$VERSION_OR_TAG"
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            VERSION=${VERSION#fork-}
          fi
          if [[ ! $VERSION =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#VERSION} -gt 10 ]]; then
            echo "::error::Use a version such as v0.1.0 or a tag such as fork-v0.1.0."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ -n $(git ls-files -- firmware/src/sunlit.lut webapp/src/data/sunlit.lut research/sunlit-foliage/sunlit.npz) ]]; then
            echo "::error::The release source must exclude the Sunlit Foliage calibration and lookup data."
            exit 1
          fi
          for notice in LICENSE NOTICE; do
            cmp "$notice" "webapp/public/$notice"
            cmp "$notice" "looklab/$notice"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex fonts-dejavu-extra fonts-noto-cjk \
            python3-pil python3-numpy python3-scipy
      - name: Build MN10300 toolchain
        working-directory: ${{ runner.temp }}
        run: |
          OM3_TOOLCHAIN="$RUNNER_TEMP/binutils/build"
          mkdir -p "$OM3_TOOLCHAIN"
          curl --fail --silent --show-error --location --retry 3 \
            -o binutils-2.42.tar.xz https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils_2.42.orig.tar.xz
          echo 'f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800  binutils-2.42.tar.xz' | sha256sum -c
          tar -xJf binutils-2.42.tar.xz -C "$(dirname "$OM3_TOOLCHAIN")"
          cd "$OM3_TOOLCHAIN"
          ../binutils-2.42/configure --target=mn10300-elf --disable-nls --disable-werror \
            --disable-gdb --disable-sim --disable-gprof --disable-gold --disable-libctf \
            --disable-gprofng --disable-shared
          make -j"$(nproc)" MAKEINFO=true all-gas all-ld all-binutils
      - name: Build and verify patch kit
        env:
          OM3_TOOLCHAIN: ${{ runner.temp }}/binutils/build
        run: bash tools/release-build.sh "$VERSION" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v6
        with:
          name: fork-patch-kit
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.repository == 'SengokuCola/Nostalgia-OM'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: fork-patch-kit
      - uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - name: Publish fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#fork-}
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          awk -v heading="## Nostalgia-OM $VERSION " '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' source/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "nostalgia-$VERSION.zip" SHA256SUMS \
            --verify-tag --prerelease --title "Nostalgia-OM $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  build-looklab:
    name: Build LookLab for Windows x64
    needs: publish
    # GitHub does not dispatch release events for releases created with GITHUB_TOKEN.
    if: >-
      ${{ !cancelled() && github.repository == 'SengokuCola/Nostalgia-OM' &&
          (github.event_name == 'release' || needs.publish.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Set up Rust
        run: rustup default stable
      - name: Install LookLab dependencies
        run: npm ci
      - name: Build the LookLab app and installer
        run: npm run package:win
      - name: Collect the Windows executables
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*_x64-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one LookLab x64 installer, found $($installers.Count)."
          }
          $assets = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'looklab-assets')
          Copy-Item -LiteralPath $installers[0].FullName -Destination $assets.FullName
          Copy-Item -LiteralPath src-tauri/target/release/looklab.exe -Destination (Join-Path $assets.FullName 'LookLab-windows-x64.exe')
      - uses: actions/upload-artifact@v6
        with:
          name: looklab-windows-x64
          path: ${{ runner.temp }}/looklab-assets/
          if-no-files-found: error
          compression-level: 0

  attach-looklab:
    name: Attach LookLab to the release
    needs: build-looklab
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: looklab-windows-x64
          path: looklab-assets
      - name: Upload missing LookLab assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh release view --json assets --jq '.assets[].name' -- "$TAG")
          for asset in looklab-assets/*.exe; do
            if ! grep -Fxq -- "${asset##*/}" <<< "$existing"; then
              gh release upload -- "$TAG" "$asset"
            fi
          done
